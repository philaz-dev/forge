name: PR Review Bundle

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-bundle-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate review bundle
        id: bundle
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OUTPUT: pr-review-bundle.md
        run: pnpm review:bundle

      - name: Upload review bundle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-review-bundle
          path: pr-review-bundle.md

      - name: Post review bundle comment
        if: always()
        uses: actions/github-script@v7
        env:
          BUNDLE_PATH: pr-review-bundle.md
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- pr-review-bundle -->";
            const limit = 65000;
            let body = fs.readFileSync(process.env.BUNDLE_PATH, "utf8");
            if (body.length > limit) {
              body =
                body.slice(0, limit - 400) +
                "\n\n```\n... truncated — see the **pr-review-bundle** " +
                "workflow artifact for the full diff.\n```\n";
            }
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            );
            const existing = comments.find(
              (c) => c.body && c.body.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Enforce check results
        if: always()
        run: |
          if [ "${{ steps.bundle.outputs.status }}" = "fail" ]; then
            echo "One or more checks failed — see the review bundle comment."
            exit 1
          fi
          echo "All checks passed."
